name: WaylandShader source build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arch-source:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    env:
      WAYLANDSHADER_BRIDGE_LIB_DIR: ${{ github.workspace }}/build/niri-support/lib
      WAYLANDSHADER_RASHADER_LIB_DIR: ${{ github.workspace }}/build/niri-deps/lib
      LD_LIBRARY_PATH: ${{ github.workspace }}/build/niri-deps/lib
      XDG_RUNTIME_DIR: ${{ runner.temp }}/waylandshader-runtime
      XDG_CONFIG_HOME: ${{ runner.temp }}/waylandshader-config
    steps:
      - name: Install Arch build dependencies
        run: |
          pacman -Syu --noconfirm --needed git rust cmake ninja python pkgconf clang \
            cairo glib2 libdisplay-info libinput libpipewire libxkbcommon mesa \
            pango pixman seatd systemd-libs wayland libepoxy qt6-base
          install -dm700 "$XDG_RUNTIME_DIR" "$XDG_CONFIG_HOME"
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
      - name: Build and stage the standalone compositor and controls
        run: python3 waylandshader/build.py --tests --jobs 2
      - name: Run upstream nonvisual Rust tests
        run: cargo test --locked --workspace --exclude niri-visual-tests --jobs 2
      - name: Check the no-D-Bus build
        run: cargo check --locked --bin niri --no-default-features --jobs 2
      - name: Check the runtime crate independently
        run: |
          cargo check --locked -p waylandshader-runtime --no-default-features --jobs 2
          cargo check --locked -p waylandshader-runtime --no-default-features --features dbus --jobs 2
      - name: Exercise Git merge and conflict preservation
        run: python3 -m unittest discover -s waylandshader/tests -p test_upstream.py
      - name: State hardware validation boundary
        run: echo "The GPU regression was compiled, not run. A real-GPU and nested/native-session check is required before installation."
